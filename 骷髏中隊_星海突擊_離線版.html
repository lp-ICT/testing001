<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#030817">
  <title>骷髏中隊：星海突擊</title>
  <style>
    :root{--cyan:#6ef3ff;--gold:#ffd65a;--red:#ff5678;--glass:#07152dcc}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;color:#eefaff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:none}
    #game{display:block;width:100%;height:100%;background:#02050d}
    #hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));text-shadow:0 2px 8px #000;display:none}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:900;letter-spacing:.06em}
    .panel{background:linear-gradient(135deg,#06152bdd,#12284abb);border:1px solid #62eaff66;border-radius:12px;padding:8px 12px;box-shadow:0 0 18px #15c6ff22;min-width:105px}
    .label{font-size:12px;color:#9fc7dc}.value{font-size:clamp(20px,4vw,30px);color:#fff}
    #time.low .value{color:var(--red);animation:pulse .55s infinite alternate}
    #lifeBar{width:min(170px,35vw);height:9px;background:#1d2940;border-radius:9px;overflow:hidden;margin-top:5px}
    #lifeFill{height:100%;background:linear-gradient(90deg,#ff4f6d,#ffd65a,#6ef3ff);width:100%;transition:width .2s}
    #combo{position:absolute;top:22%;left:50%;transform:translateX(-50%) rotate(-3deg);font-size:clamp(26px,7vw,52px);font-style:italic;font-weight:1000;color:var(--gold);opacity:0;transition:.15s}
    #combo.show{opacity:1;transform:translateX(-50%) rotate(-3deg) scale(1.1)}
    #notice{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,7vw,54px);font-weight:1000;color:#fff;text-align:center;filter:drop-shadow(0 0 12px #38dfff)}
    #mobile{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none}
    .touchBtn{pointer-events:auto;border:2px solid #8df7ffaa;color:#fff;background:#07345ca8;backdrop-filter:blur(7px);font-weight:900;border-radius:50%;box-shadow:inset 0 0 20px #41cfff33,0 0 16px #0009;user-select:none}
    #fire{width:88px;height:88px;font-size:18px}#burst{width:70px;height:70px;font-size:14px;border-color:#ffd65acc;background:#5c3e08aa;color:#fff4c1;margin-left:auto;margin-right:14px}
    #tilt{width:66px;height:66px;font-size:12px}
    #overlay{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 35%,#193f74cc 0,#061126e8 34%,#01040cf7 80%);z-index:5;overflow:auto}
    .card{width:min(620px,100%);border:1px solid #6ef3ff66;border-radius:22px;padding:clamp(20px,5vw,38px);background:linear-gradient(160deg,#07152df0,#030714f5);box-shadow:0 0 55px #1fafff2e,inset 0 0 35px #15416c55;text-align:center}
    .emblem{width:96px;height:96px;margin:auto auto 10px;border:3px solid #f6fbff;border-radius:50%;display:grid;place-items:center;font-size:52px;transform:rotate(-6deg);box-shadow:0 0 20px #69efff}
    h1{margin:6px 0;font-size:clamp(30px,8vw,56px);line-height:1;color:#fff;font-style:italic;letter-spacing:.04em;text-shadow:4px 4px 0 #e03156,0 0 24px #28cfff}
    .sub{color:#8eeaff;font-weight:800;letter-spacing:.22em;margin:10px 0 22px}
    .rules{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;text-align:left;margin:18px 0;color:#d7e9f8}
    .rules div{background:#0d2038;border-radius:10px;padding:10px 12px;border-left:3px solid var(--cyan)}
    button{font:inherit;cursor:pointer}
    .primary{width:100%;border:0;border-radius:12px;padding:14px 20px;font-size:20px;font-weight:1000;color:#07101d;background:linear-gradient(100deg,#6ef3ff,#fff4a7);box-shadow:0 7px 25px #2edbff55}
    .primary:active,.touchBtn:active{transform:scale(.96)}
    #final{display:none}.scoreBig{font-size:64px;font-weight:1000;color:var(--gold);line-height:1;margin:12px}.small{font-size:14px;color:#9db8cb}.new{color:#ffdc62;font-weight:900;display:none}
    @keyframes pulse{to{transform:scale(1.08)}}
    @media(pointer:coarse),(max-width:720px){#mobile.playing{display:flex}.rules{grid-template-columns:1fr}.desktopOnly{display:none}.panel{padding:6px 9px;min-width:88px}.label{font-size:10px}.value{font-size:18px}}
  </style>
</head>
<body>
<canvas id="game" aria-label="星海射擊遊戲"></canvas>
<div id="hud">
  <div class="top">
    <div class="panel"><div class="label">SCORE 得分</div><div id="score" class="value">000000</div></div>
    <div class="panel"><div class="label">ARMOR 機體</div><div id="lifeBar"><div id="lifeFill"></div></div><div id="weapon" class="small">多彈齊發 READY</div></div>
    <div id="time" class="panel"><div class="label">TIME 時間</div><div class="value"><span id="timer">90</span>s</div></div>
  </div>
  <div id="combo"></div><div id="notice"></div>
</div>
<div id="mobile">
  <button id="tilt" class="touchBtn">啟用<br>傾斜</button>
  <button id="burst" class="touchBtn">多彈<br>齊發</button>
  <button id="fire" class="touchBtn">發射</button>
</div>
<div id="overlay">
  <section id="intro" class="card">
    <div class="emblem">☠</div>
    <h1>骷髏中隊<br>星海突擊</h1>
    <div class="sub">SKULL SQUADRON</div>
    <div class="rules">
      <div><b>移動</b><br><span class="desktopOnly">方向鍵／WASD</span><span>　手機傾斜或拖動畫面</span></div>
      <div><b>普通飛彈</b><br><span class="desktopOnly">空白鍵</span><span>　按住「發射」</span></div>
      <div><b>多彈齊發</b><br><span class="desktopOnly">X／Shift</span><span>　擊中後需冷卻</span></div>
      <div><b>任務</b><br>90 秒內擊落更多敵機</div>
    </div>
    <button id="start" class="primary">開始出擊</button>
    <p class="small">原創致敬風格 · 無需網絡 · 音效首次操作後啟動</p>
  </section>
  <section id="final" class="card">
    <div class="emblem">★</div><h1>任務完成</h1>
    <div class="small">本次得分</div><div id="finalScore" class="scoreBig">0</div>
    <div id="newBest" class="new">NEW RECORD 新紀錄！</div>
    <p>最高分：<b id="best">0</b>　擊落：<b id="kills">0</b></p>
    <button id="restart" class="primary">再次出擊</button>
  </section>
</div>

  bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});
  enemies.forEach(e=>{e.t+=dt;e.x+=e.vx*dt+Math.sin(e.t*(e.fast?4.5:2.7))*(e.fast?85:28)*dt;e.y+=e.vy*dt;if(e.x<25||e.x>W-25)e.vx*=-1;e.x=Math.max(25,Math.min(W-25,e.x));if(now>e.shot&&e.y>0&&e.y<H*.75){let a=Math.atan2(player.y-e.y,player.x-e.x),sp=210+difficulty*12;enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5});sound('enemyFire');e.shot=now+(e.fast?520:900)+Math.random()*(e.fast?900:1600)}}
  );enemyBullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});powerups.forEach(p=>p.y+=p.vy*dt);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt});
  for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.y>H+50){enemies.splice(i,1);damage();continue}for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){bullets.splice(j,1);if(hitEnemy(e,b.heavy?2:1)){enemies.splice(i,1)}break}}}
  for(let i=enemyBullets.length-1;i>=0;i--){let b=enemyBullets[i];if(Math.hypot(b.x-player.x,b.y-player.y)<20+b.r){enemyBullets.splice(i,1);damage()}else if(b.y>H+20||b.x<-20||b.x>W+20)enemyBullets.splice(i,1)}
  for(let i=powerups.length-1;i>=0;i--){let p=powerups[i];if(Math.hypot(p.x-player.x,p.y-player.y)<30){powerups.splice(i,1);player.hp=Math.min(100,player.hp+20);player.burst=0;score+=500;sound('power');flash('補給：齊射就緒！')}else if(p.y>H+20)powerups.splice(i,1)}
  bullets=bullets.filter(b=>b.y>-40&&b.x>-40&&b.x<W+40);particles=particles.filter(p=>p.life>0);
  $('#score').textContent=String(score).padStart(6,'0');$('#timer').textContent=Math.ceil(left/1000);$('#time').classList.toggle('low',left<10000);$('#lifeFill').style.width=player.hp+'%';let cool=Math.max(0,player.burst-now);$('#weapon').textContent=cool?'多彈冷卻 '+(cool/1000).toFixed(1)+'s':'多彈齊發 READY';let ce=$('#combo');if(combo>1&&now-comboAt<1500){ce.textContent=combo+' COMBO';ce.classList.add('show')}else ce.classList.remove('show')
}
function path(points){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath()}
function drawShip(x,y){ctx.save();ctx.translate(x,y);let blink=player.inv>performance.now()&&Math.floor(performance.now()/80)%2;ctx.globalAlpha=blink?.35:1;ctx.shadowBlur=player.inv>performance.now()?25:13;ctx.shadowColor='#65edff';ctx.drawImage(playerImg,-39,-52,78,104);ctx.shadowBlur=14;ctx.fillStyle='#70efff';ctx.fillRect(-13,48,7,13);ctx.fillRect(6,48,7,13);ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(e.t*(e.fast?4:2))*(e.fast?.14:.09));let glows=['#79eaff','#ff6aa2','#ffd45e','#ff493f','#879bff'],glow=glows[e.type];ctx.shadowBlur=e.fast?17:10+e.type*4;ctx.shadowColor=glow;if(e.fast){let img=e.type===3?fastRedImg:fastBlueImg,w=e.r*1.8,h=e.r*2.5;ctx.drawImage(img,-w/2,-h*.44,w,h)}else{ctx.filter=e.type===1?'hue-rotate(300deg) saturate(1.35)':e.type===2?'sepia(.5) saturate(2.2)':'none';let w=e.r*1.65,h=e.r*2.45;ctx.drawImage(enemyImg,-w/2,-h*.43,w,h);ctx.filter='none'}ctx.shadowBlur=0;if(e.hp<e.max){ctx.fillStyle='#0b1425';ctx.fillRect(-e.r,-e.r-13,e.r*2,4);ctx.fillStyle=e.type===2?'#ffd45e':e.type===3?'#ff685c':e.type===4?'#8da3ff':'#6effa8';ctx.fillRect(-e.r,-e.r-13,e.r*2*e.hp/e.max,4)}ctx.restore()}
function drawRocket(b,enemy=false){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);let heavy=!!b.heavy,sc=heavy?1.3:1,len=enemy?19:heavy?22:17,w=enemy?7:heavy?8:6;ctx.scale(sc,sc);ctx.shadowBlur=12;ctx.shadowColor=enemy?'#ff9d38':heavy?'#ffe45e':'#65efff';ctx.fillStyle=enemy?'#f1f2f5':'#f8fbff';ctx.beginPath();ctx.moveTo(0,-len*.55);ctx.lineTo(w*.48,-len*.25);ctx.lineTo(w*.48,len*.38);ctx.lineTo(-w*.48,len*.38);ctx.lineTo(-w*.48,-len*.25);ctx.closePath();ctx.fill();ctx.fillStyle=enemy?'#ff5b42':heavy?'#ffd43b':'#40dfff';ctx.beginPath();ctx.moveTo(0,-len*.62);ctx.lineTo(w*.5,-len*.25);ctx.lineTo(-w*.5,-len*.25);ctx.closePath();ctx.fill();ctx.fillRect(-w*.52,len*.03,w*1.04,3);ctx.fillStyle=enemy?'#7d2630':'#497188';ctx.beginPath();ctx.moveTo(-w*.45,len*.2);ctx.lineTo(-w*.9,len*.52);ctx.lineTo(-w*.35,len*.42);ctx.lineTo(w*.35,len*.42);ctx.lineTo(w*.9,len*.52);ctx.lineTo(w*.45,len*.2);ctx.closePath();ctx.fill();ctx.fillStyle='#fff5a0';ctx.beginPath();ctx.moveTo(-w*.25,len*.4);ctx.lineTo(0,len*.82+Math.random()*5);ctx.lineTo(w*.25,len*.4);ctx.closePath();ctx.fill();ctx.fillStyle='#ff7a24';ctx.beginPath();ctx.moveTo(-w*.14,len*.4);ctx.lineTo(0,len*.67+Math.random()*3);ctx.lineTo(w*.14,len*.4);ctx.closePath();ctx.fill();ctx.restore()}
function draw(){ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.84}let g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.7);g.addColorStop(0,'#0c2851');g.addColorStop(.45,'#07152f');g.addColorStop(1,'#01030a');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);stars.forEach(s=>{ctx.globalAlpha=.3+s.z*.3;ctx.fillStyle=s.z>1?'#c8f7ff':'#7aa8d8';ctx.fillRect(s.x,s.y,s.s,3+s.z*3)});ctx.globalAlpha=1;
  bullets.forEach(b=>drawRocket(b,false));
  enemies.forEach(drawEnemy);enemyBullets.forEach(b=>drawRocket(b,true));
  powerups.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(performance.now()/250);ctx.strokeStyle='#ffe46b';ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor='#ffe46b';ctx.strokeRect(-9,-9,18,18);ctx.restore()});
  particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)});ctx.globalAlpha=1;drawShip(player.x,player.y);ctx.restore()}
function loop(now){if(!playing)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt,now);draw();if(playing)requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
function hold(el,on,off){el.addEventListener('pointerdown',e=>{e.preventDefault();on();el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off)}
hold($('#fire'),()=>{fireHeld=true;initAudio()},()=>fireHeld=false);$('#burst').onpointerdown=e=>{e.preventDefault();initAudio();burst()};
canvas.addEventListener('pointerdown',e=>{if(!playing)return;drag=true;canvas.setPointerCapture(e.pointerId);player.x=e.clientX;player.y=e.clientY});canvas.addEventListener('pointermove',e=>{if(drag&&playing){player.x=e.clientX;player.y=e.clientY}});canvas.addEventListener('pointerup',()=>drag=false);
$('#tilt').onclick=async()=>{initAudio();if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{if(await DeviceOrientationEvent.requestPermission()!=='granted')return}catch(e){return}}tilt.on=!tilt.on;$('#tilt').innerHTML=tilt.on?'傾斜<br>已啟用':'啟用<br>傾斜'};
addEventListener('deviceorientation',e=>{if(!tilt.on)return;let portrait=innerHeight>=innerWidth;tilt.x=Math.max(-1,Math.min(1,(portrait?e.gamma:e.beta)/24));tilt.y=Math.max(-1,Math.min(1,(portrait?e.beta:-e.gamma)/28))});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){startAt+=performance.now()-last;last=performance.now()}});
draw();
})();
</script>
